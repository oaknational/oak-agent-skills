# Written by oak-skills init. Fails a pull request if a synced agent skill was edited, is out of
# date, or sits beside something oak-skills didn't write. Make it a required check.
name: oak-skills check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: oak-skills-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: oak-skills check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uses the pnpm version in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Only the root package, which holds oak-skills: a workspace's other packages aren't needed.
      - name: Install the root package without running dependency scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - name: Check the synced agent skills
        run: pnpm exec oak-skills check
