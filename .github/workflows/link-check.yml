name: Link check

# CI checks internal links offline on every pull request. This checks external links too, weekly,
# because pages elsewhere move or disappear without any change here.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    name: Check every link
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-tool.sh lychee
      - name: Check internal and external links
        env:
          # Read-only, so links to GitHub aren't rate limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --config lychee.toml --offline=false .

  report-failure:
    name: Report a failed run
    # GitHub only emails a scheduled run's failure to whoever last edited the workflow.
    needs: links
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # to open an issue for the skills maintainers
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The weekly link check failed"
          body="The scheduled link check found broken links: ${RUN_URL}

          @oaknational/skills-maintainers, please look at the run's log."
          existing="$(gh issue list --repo "$REPO" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
