name: Publish

# Releases the package. On every push to main, Changesets chooses what to do:
#
# - With changesets waiting, it opens or updates the version PR, "chore: version packages". It
#   uses a token from the GitHub App, because a PR opened with GITHUB_TOKEN wouldn't start
#   workflows, so its required checks would never report.
# - Once the version PR merges, the version on main isn't on npm yet. The gates run, check the
#   tarball, and pass it to the publish job, which publishes it with npm trusted publishing.
#   The publish job is the only one with id-token: write, and it doesn't build, test or run any
#   package scripts: it publishes the tarball the gates checked.
#
# The App's Client ID and private key, OAK_SKILLS_APP_CLIENT_ID and OAK_SKILLS_APP_KEY, are secrets
# in the release environment, which only main can use, so workflows on other branches can't read them.
on:
  push:
    branches: [main]

permissions: {}

# Releases run one at a time, and a run is never cancelled part-way through publishing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  mode:
    name: Choose what to release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # "version" with changesets waiting, "publish" when main's version isn't on npm, else "none".
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Open or update the version PR
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create a token for the GitHub App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OAK_SKILLS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OAK_SKILLS_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Commits through the GitHub API, so the commit is the App's and signed by GitHub.
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app.outputs.token }}
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'

  gates:
    name: Check the release
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      package: ${{ steps.upload.outputs.artifact-id }}
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the secret scan.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: .github/scripts/install-tool.sh gitleaks
      - run: uv tool install cisco-ai-skill-scanner==2.2.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A published version can't be withdrawn, so secrets and personal data are checked here
      # too, over the whole history, immediately before publishing.
      - name: Scan for secrets and personal data
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
      - name: Scan every skill, failing on high severity
        run: |
          status=0
          while read -r dir; do
            skill-scanner scan "$dir" --policy .github/skill-scanner-policy.yaml \
              --fail-on-severity high --format table || status=1
          done < <(find skills/central skills/repos -mindepth 2 -maxdepth 3 -name SKILL.md -exec dirname {} + 2>/dev/null | sort -u)
          exit "$status"
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec publint --strict
      # Packs exactly what Changesets will publish, then checks that tarball.
      - name: Pack the release
        run: pnpm exec changeset pack --out-dir "$RUNNER_TEMP/release"
      - name: Check the package contents
        run: |
          tarballs=("$RUNNER_TEMP"/release/packages/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected one tarball to publish." >&2
            exit 1
          fi
          node scripts/check-package.ts "${tarballs[0]}"
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to tag the release and create its GitHub release
      id-token: write # for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm comes from packageManager: 11.2.0, which publishes with trusted publishing itself.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 brings npm 11.5.1 or later. No registry-url: the .npmrc it writes would put a
      # token placeholder in the way of trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Only for the Changesets command. Nothing is built, and no package scripts run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Publishes the checked tarball, tags the release v<version> and creates its GitHub release.
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.gates.outputs.package }}
